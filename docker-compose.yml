services:
  mysql-db:
    image: mysql:8.0
    container_name: my_dotnet_project_db
    environment:
      MYSQL_ROOT_PASSWORD: my_super_secret_root_password
      MYSQL_DATABASE: MyDotnetAppDb
      MYSQL_USER: dotnet_user
      MYSQL_PASSWORD: dotnet_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: